<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking ICFES Saber 11 – 2026 · Montelíbano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f6f5f1;--bgg:linear-gradient(160deg,#00b09b 0%,#96c93d 40%,#ffd200 72%,#ff8008 100%);--card:#fff;--tx:#1b1b19;--tx2:#5a5954;--bd:#e3e1d9;--track:#eeece6;--blue:#6a3df0;--gold:#ffbe0b;--silver:#9a9890;--bronze:#fb5607;--acc:#e6f1fb;--accx:#0c447c;--line:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161615;--bgg:linear-gradient(160deg,#2b1b5e 0%,#4a1f6e 50%,#0f3b73 100%);--card:#1f1f1d;--tx:#f0efec;--tx2:#b4b2a9;--bd:#33332f;--track:#2a2a27;--blue:#3987e5;--gold:#c98500;--silver:#888780;--bronze:#d95926;--acc:#0c447c;--accx:#b5d4f4;--line:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161615;--bgg:linear-gradient(160deg,#2b1b5e 0%,#4a1f6e 50%,#0f3b73 100%);--card:#1f1f1d;--tx:#f0efec;--tx2:#b4b2a9;--bd:#33332f;--track:#2a2a27;--blue:#3987e5;--gold:#c98500;--silver:#888780;--bronze:#d95926;--acc:#0c447c;--accx:#b5d4f4;--line:#e66767}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:var(--bgg);background-attachment:fixed;color:var(--tx);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;font-weight:700}
.w{max-width:880px;margin:0 auto;padding:20px 16px 32px}
h1{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:36px;font-weight:700;margin:4px 0 2px;letter-spacing:.3px}
.sub{color:var(--tx2);font-size:14px;margin:0 0 18px}
.hero{background:linear-gradient(120deg,#5f0fff,#d61f9c);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:18px;text-align:center}
.hero h1{color:#fff;margin:8px 0 4px}.hero .sub{color:#f6ecff;margin:0;font-size:15px}
.hero .tag{background:#ffd200;color:#3a2a00;font-weight:800}
.tag{display:inline-block;background:var(--acc);color:var(--accx);font-size:12px;padding:3px 10px;border-radius:20px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kc{background:var(--card);border:1px solid var(--bd);border-top:5px solid #6a3df0;border-radius:12px;padding:12px 14px}
.kc:nth-child(2){border-top-color:#ff8008}.kc:nth-child(3){border-top-color:#d61f9c}.kc:nth-child(4){border-top-color:#00b09b}
.kl{font-size:13px;font-weight:800;color:var(--tx2)}.kv{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}.ks{font-size:12px;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--bd);border-top:5px solid #d61f9c;border-radius:12px;padding:16px;margin-bottom:18px}
h2{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:21px;font-weight:600;margin:0 0 12px}
.pod{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.pc{border-radius:10px;padding:10px 8px;text-align:center;color:#fff}
.pc b{display:block;font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:32px;font-variant-numeric:tabular-nums}.pc span{font-size:13px;line-height:1.2;display:block}
.pc i{font-style:normal;font-size:12px;opacity:.9}
.p1{background:var(--gold);color:#2b1500;min-height:130px}.pc em{display:block;font-style:normal;font-size:26px;line-height:1.2}.p2{background:var(--silver);min-height:108px}.p3{background:var(--bronze);min-height:92px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ctl button{font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;cursor:pointer}
.ctl button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.row{display:grid;grid-template-columns:30px 200px 1fr 42px;gap:10px;align-items:center;padding:5px 0;border-radius:8px}
.row:hover{background:var(--track)}
.n{width:26px;height:26px;border-radius:50%;background:var(--track);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.nm{font-size:15px;font-weight:800;line-height:1.25}
.tr{position:relative;height:18px;background:var(--track);border-radius:4px}
.b{height:18px;border-radius:4px;background:var(--blue)}
.b.lo{background:var(--silver)}
.b.t1{background:var(--gold)}.b.t3{background:var(--bronze)}
.av{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--line)}
.sc{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:12px}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--blue);vertical-align:-1px}
.lg .l2::before{background:var(--silver)}.lg .l3::before{width:0;height:12px;border-radius:0;border-left:2px dashed var(--line);background:none}
.note{font-size:12px;color:var(--tx2);margin-top:10px}
@media(max-width:560px){.row{grid-template-columns:28px 1fr 40px}.tr{grid-column:2/4;grid-row:2}.sc{grid-column:3;grid-row:1}h1{font-size:27px}}
</style>
</head>
<body>
<div class="w">
<div class="hero"><span class="tag">Montelíbano, Córdoba · instituciones oficiales</span>
<h1>🏆 Ranking ICFES Saber 11 – 2026</h1>
<p class="sub">Puntaje obtenido por cada institución, de mayor a menor.</p></div>
<div class="k" id="k"></div>
<div class="card"><h2>El podio</h2><div class="pod" id="pod"></div></div>
<div class="card">
<h2>Ranking completo</h2>
<div class="ctl" id="ctl">
<button data-f="all" class="on">Todas</button>
<button data-f="hi">Sobre el promedio</button>
<button data-f="lo">Bajo el promedio</button>
</div>
<div id="list"></div>
<div class="lg"><span>Sobre el promedio</span><span class="l2">Bajo el promedio</span><span class="l3">Promedio del grupo</span></div>
<div class="note">Las instituciones en las posiciones 8 y 9 empatan con 242 puntos.</div>
</div>
</div>
<script>
var D=[["Samac",308],["Técnico Agropecuario Claret",305],["La Esperanza",273],["San Bernardo",264],["María Goretti",260],["Alianza",255],["Cesum",247],["Instituto San Jorge",242],["Simón Bolívar Los Córdoba",242],["San José (Anchica)",241],["San Francisco",238],["Belén",226],["Antonio Nariño (Anclar)",225],["José María Córdoba (Pica)",219],["Palmar",212]];
var sum=0;D.forEach(function(x){sum+=x[1]});
var avg=sum/D.length;
var hi=D.filter(function(x){return x[1]>avg}).length;
document.getElementById("k").innerHTML=
 '<div class="kc"><div class="kl">🏫 Instituciones</div><div class="kv">'+D.length+'</div><div class="ks">en el ranking</div></div>'+
 '<div class="kc"><div class="kl">⭐ Puntaje más alto</div><div class="kv">'+D[0][1]+'</div><div class="ks">'+D[0][0]+'</div></div>'+
 '<div class="kc"><div class="kl">📊 Promedio del grupo</div><div class="kv">'+avg.toFixed(1)+'</div><div class="ks">'+hi+' sobre el promedio</div></div>'+
 '<div class="kc"><div class="kl">📏 Brecha 1.º – 15.º</div><div class="kv">'+(D[0][1]-D[D.length-1][1])+'</div><div class="ks">puntos de diferencia</div></div>';
var pd=[1,0,2],cl=["p2","p1","p3"],pos=["2.º","1.º","3.º"],me=["🥈","🥇","🥉"];
document.getElementById("pod").innerHTML=pd.map(function(i,j){return '<div class="pc '+cl[j]+'"><em>'+me[j]+'</em><i>'+pos[j]+' puesto</i><span>'+D[i][0]+'</span><b>'+D[i][1]+'</b></div>'}).join("");
function render(f){
 var h="";
 D.forEach(function(x,i){
  var up=x[1]>avg;
  if(f==="hi"&&!up)return;if(f==="lo"&&up)return;
  h+='<div class="row"><div class="n">'+(i<3?["🥇","🥈","🥉"][i]:(i+1))+'</div><div class="nm">'+x[0]+'</div><div class="tr"><div class="b'+(up?'':' lo')+(i===0?' t1':i===2?' t3':'')+'" style="width:'+(x[1]/320*100)+'%"></div><div class="av" style="left:'+(avg/320*100)+'%"></div></div><div class="sc">'+x[1]+'</div></div>';
 });
 document.getElementById("list").innerHTML=h;
}
render("all");
document.getElementById("ctl").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 Array.prototype.forEach.call(this.children,function(c){c.classList.remove("on")});
 b.classList.add("on");render(b.getAttribute("data-f"));
});
</script>
</body>
</html>
